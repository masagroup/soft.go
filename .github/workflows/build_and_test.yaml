name: Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.27.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    - name: Checkout Go
      uses: actions/checkout@v4
      with:
        path: go
    - name: Checkout Models
      uses: actions/checkout@v4
      with:
        repository: masagroup/soft.models
        ref: 9217d2a7fb05019340ff6fe9feb335a79673e6c1
        path: models
    - name: Generate
      working-directory: go
      run: make generate
    - name: Check Generated Code
      working-directory: go
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "::error::the committed generated code differs from make generate: regenerate and commit"
          git status --porcelain
          git --no-pager diff --stat
          exit 1
        fi
    - name: Build And Test
      working-directory: go
      run: make build test
